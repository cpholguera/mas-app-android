name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Run Unit Tests
      run: |
        ./gradlew test
        report_file=$(find app/build/reports/tests/testDebugUnitTest -type f -name 'RunMastgTest.html' -print -quit 2>/dev/null || true)
        mastgTestOutput=""
        if [[ -n "$report_file" ]]; then
          mastgTestOutput=$(grep -oP '(?<=<pre>MastgTestOutput: ).*' "$report_file" || true)
        else
          echo "RunMastgTest HTML report not found; continuing without test output."
        fi
        echo "Test output: $mastgTestOutput"
        echo "MASTG_TEST_OUTPUT=$mastgTestOutput" >> $GITHUB_OUTPUT
        echo "MASTG_TEST_OUTPUT=$mastgTestOutput" >> $GITHUB_ENV

    - name: Build debug version
      run: ./gradlew assembleDebug

    - name: Build release version
      run: ./gradlew assembleRelease
